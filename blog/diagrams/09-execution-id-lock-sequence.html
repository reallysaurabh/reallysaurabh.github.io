<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Execution ID as Lock — Sequence</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #fafafa; margin: 0; padding: 32px; color: #1a1a1a; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.caption { font-size: 13px; color: #666; margin: 12px 0 0; text-align: center; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Execution ID as Concurrency Lock — Two Concurrent Requests</h1>
  <svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
      </marker>
    </defs>

    <!-- lifelines -->
    <text x="100" y="30" font-size="12" font-weight="600" text-anchor="middle">Request A</text>
    <line x1="100" y1="40" x2="100" y2="400" stroke="#ccc" stroke-width="1"/>

    <text x="330" y="30" font-size="12" font-weight="600" text-anchor="middle">Resource Record</text>
    <line x1="330" y1="40" x2="330" y2="400" stroke="#ccc" stroke-width="1"/>

    <text x="560" y="30" font-size="12" font-weight="600" text-anchor="middle">Workflow Engine</text>
    <line x1="560" y1="40" x2="560" y2="400" stroke="#ccc" stroke-width="1"/>

    <text x="740" y="30" font-size="12" font-weight="600" text-anchor="middle">Request B</text>
    <line x1="740" y1="40" x2="740" y2="400" stroke="#ccc" stroke-width="1"/>

    <!-- A starts workflow -->
    <line x1="100" y1="70" x2="560" y2="70" stroke="#3b6fd6" stroke-width="1.5" marker-end="url(#arrow3)"/>
    <text x="330" y="63" font-size="11" text-anchor="middle" fill="#3b6fd6">start workflow (mutate resource X)</text>

    <!-- engine assigns exec id, resource claims it -->
    <line x1="560" y1="100" x2="330" y2="100" stroke="#3b6fd6" stroke-width="1.5" marker-end="url(#arrow3)"/>
    <text x="440" y="93" font-size="11" text-anchor="middle" fill="#3b6fd6">locked_by = exec-A-9f2</text>

    <rect x="270" y="112" width="120" height="26" rx="5" fill="#eef4ff" stroke="#3b6fd6"/>
    <text x="330" y="130" font-size="10.5" text-anchor="middle" fill="#3b6fd6">LOCKED (exec-A-9f2)</text>

    <!-- B arrives -->
    <line x1="740" y1="160" x2="330" y2="160" stroke="#d6603b" stroke-width="1.5" marker-end="url(#arrow3)"/>
    <text x="540" y="153" font-size="11" text-anchor="middle" fill="#d6603b">start workflow (mutate resource X)</text>

    <line x1="330" y1="190" x2="560" y2="190" stroke="#d6603b" stroke-width="1.5" marker-end="url(#arrow3)"/>
    <text x="440" y="183" font-size="11" text-anchor="middle" fill="#d6603b">is exec-A-9f2 still live?</text>

    <line x1="560" y1="220" x2="330" y2="220" stroke="#d6603b" stroke-width="1.5" marker-end="url(#arrow3)"/>
    <text x="440" y="213" font-size="11" text-anchor="middle" fill="#d6603b">yes, still running</text>

    <line x1="330" y1="250" x2="740" y2="250" stroke="#d6603b" stroke-width="1.5" marker-end="url(#arrow3)"/>
    <text x="540" y="243" font-size="11" text-anchor="middle" fill="#d6603b">rejected: resource locked, retry later</text>

    <!-- A finishes -->
    <line x1="560" y1="300" x2="330" y2="300" stroke="#3b6fd6" stroke-width="1.5" marker-end="url(#arrow3)"/>
    <text x="440" y="293" font-size="11" text-anchor="middle" fill="#3b6fd6">exec-A-9f2 completed</text>

    <line x1="330" y1="330" x2="330" y2="330" stroke="#3b6fd6" stroke-width="1.5"/>
    <rect x="270" y="342" width="120" height="26" rx="5" fill="#eafff0" stroke="#2f9e57"/>
    <text x="330" y="360" font-size="10.5" text-anchor="middle" fill="#2f9e57">locked_by = null (free)</text>

    <text x="330" y="395" font-size="11" text-anchor="middle" fill="#666">Only the orchestrator clears the lock — never a retriable activity step</text>
  </svg>
  <p class="caption">The execution ID doubles as the lock token. Request B is rejected purely by checking whether resource X's owning execution is still alive.</p>
</div>
</body>
</html>
