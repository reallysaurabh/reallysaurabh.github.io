<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baked-In vs. Runtime Config</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 18px; color: #1a1a2e; text-align: center; margin: 0 0 4px; }
  p.caption { text-align: center; color: #6b7280; font-size: 13px; margin: 0 0 16px; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Baked Into the Image vs. Injected at Runtime</h1>
  <p class="caption">Same value, two very different change-cost profiles.</p>
  <svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
      </marker>
      <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
      </marker>
    </defs>

    <!-- Left: baked in -->
    <rect x="40" y="40" width="340" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="210" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Change a value</text>
    <text x="210" y="83" text-anchor="middle" font-size="11" fill="#b91c1c">(baked into image)</text>

    <line x1="210" y1="100" x2="210" y2="130" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>

    <rect x="40" y="140" width="340" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="210" y="175" text-anchor="middle" font-size="13" fill="#991b1b">Build → review → redeploy every instance</text>

    <text x="210" y="230" text-anchor="middle" font-size="12" fill="#6b7280">Full release cycle for a one-line change</text>

    <!-- Right: runtime -->
    <rect x="480" y="40" width="340" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="650" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Change a value</text>
    <text x="650" y="83" text-anchor="middle" font-size="11" fill="#047857">(runtime config)</text>

    <line x1="650" y1="100" x2="650" y2="130" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <rect x="480" y="140" width="340" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="650" y="175" text-anchor="middle" font-size="13" fill="#065f46">Update value → agent picks it up, logged &amp; attributable</text>

    <text x="650" y="230" text-anchor="middle" font-size="12" fill="#6b7280">No new artifact, no coordination — still audited</text>
  </svg>
</div>
</body>
</html>
