<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Two-Layer Budget Diagram</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #fafafa; margin: 0; padding: 32px; color: #1a1a1a; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.caption { font-size: 13px; color: #666; margin: 12px 0 0; text-align: center; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>The Two-Layer Budget Problem</h1>
  <svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
      </marker>
    </defs>

    <!-- Request -->
    <rect x="330" y="10" width="100" height="36" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
    <text x="380" y="33" font-size="13" text-anchor="middle" fill="#1a1a1a">Request</text>
    <line x1="380" y1="46" x2="380" y2="80" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Soft layer -->
    <rect x="60" y="80" width="640" height="110" rx="8" fill="#eef4ff" stroke="#3b6fd6" stroke-width="1.5"/>
    <text x="80" y="106" font-size="13" font-weight="600" fill="#3b6fd6">SOFT LAYER — Platform Allocation Tracking</text>
    <text x="80" y="128" font-size="12" fill="#333">Per-team / per-project budgets, dashboards, alerts</text>
    <text x="80" y="148" font-size="12" fill="#333">Fast, queryable, advisory — believes it's authoritative</text>
    <rect x="480" y="118" width="190" height="48" rx="6" fill="#ffffff" stroke="#3b6fd6"/>
    <text x="575" y="138" font-size="11" text-anchor="middle" fill="#3b6fd6" font-weight="600">Team says: "$4,000 left"</text>
    <text x="575" y="154" font-size="11" text-anchor="middle" fill="#3b6fd6">(soft-layer belief)</text>

    <line x1="380" y1="190" x2="380" y2="230" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Hard layer -->
    <rect x="60" y="230" width="640" height="110" rx="8" fill="#fff3ec" stroke="#d6603b" stroke-width="1.5"/>
    <text x="80" y="256" font-size="13" font-weight="600" fill="#d6603b">HARD LAYER — Provider Billing Enforcement</text>
    <text x="80" y="278" font-size="12" fill="#333">Actual account-level spend cap, enforced by the provider</text>
    <text x="80" y="298" font-size="12" fill="#333">Doesn't know or care about the soft layer's bookkeeping</text>
    <rect x="480" y="268" width="190" height="48" rx="6" fill="#ffffff" stroke="#d6603b"/>
    <text x="575" y="288" font-size="11" text-anchor="middle" fill="#d6603b" font-weight="600">Account says: "$500 left"</text>
    <text x="575" y="304" font-size="11" text-anchor="middle" fill="#d6603b">(hard-layer reality)</text>

    <line x1="380" y1="340" x2="380" y2="370" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Trapped capacity callout -->
    <rect x="180" y="372" width="400" height="72" rx="8" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="380" y="394" font-size="12" font-weight="700" text-anchor="middle" fill="#8a6300">⚠ Trapped Capacity</text>
    <text x="380" y="412" font-size="11.5" text-anchor="middle" fill="#5c4a00">Soft layer believes $4,000 is spendable.</text>
    <text x="380" y="428" font-size="11.5" text-anchor="middle" fill="#5c4a00">Hard layer will only ever allow $500 of it.</text>
  </svg>
  <p class="caption">A request clears the soft allocation check, then hits the hard provider cap. When the two disagree, the gap between them is capacity nobody can actually use.</p>
</div>
</body>
</html>
