<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secretless Provisioning Sequence</title>
<style>
  body { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; background: #fafafa; color: #1a1a1a; margin: 0; padding: 32px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .caption { color: #666; font-size: 13px; margin-bottom: 20px; }
  svg { width: 100%; height: auto; background: #ffffff; border: 1px solid #e2e2e2; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Secretless Provisioning: Token Exchange, Not Stored Keys</h1>
  <div class="caption">No long-lived secret appears anywhere in this sequence — only short-lived tokens, exchanged just in time.</div>
  <svg viewBox="0 0 920 320" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,3 L0,6 Z" fill="#444" />
      </marker>
    </defs>

    <!-- lifelines -->
    <text x="100" y="35" text-anchor="middle" font-size="13" font-weight="700">Provisioning Pipeline</text>
    <line x1="100" y1="45" x2="100" y2="280" stroke="#bbb" stroke-width="1.5"/>

    <text x="380" y="35" text-anchor="middle" font-size="13" font-weight="700">Identity Provider</text>
    <line x1="380" y1="45" x2="380" y2="280" stroke="#bbb" stroke-width="1.5"/>

    <text x="680" y="35" text-anchor="middle" font-size="13" font-weight="700">Cloud API</text>
    <line x1="680" y1="45" x2="680" y2="280" stroke="#bbb" stroke-width="1.5"/>

    <!-- step 1 -->
    <line x1="100" y1="80" x2="375" y2="80" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow5)"/>
    <text x="240" y="72" text-anchor="middle" font-size="11.5">1. presents internal workload token</text>

    <!-- step 2 -->
    <rect x="330" y="95" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="380" y="116" text-anchor="middle" font-size="10.5">verifies &amp; trusts</text>

    <!-- step 3 -->
    <line x1="380" y1="145" x2="105" y2="145" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow5)"/>
    <text x="240" y="137" text-anchor="middle" font-size="11.5">2. issues short-lived cloud credential</text>

    <!-- step 4 -->
    <line x1="100" y1="180" x2="675" y2="180" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow5)"/>
    <text x="390" y="172" text-anchor="middle" font-size="11.5">3. calls cloud API with short-lived credential</text>

    <!-- step 5 -->
    <line x1="680" y1="215" x2="105" y2="215" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow5)"/>
    <text x="390" y="207" text-anchor="middle" font-size="11.5">4. resource created / modified / destroyed</text>

    <!-- expiry note -->
    <rect x="300" y="240" width="320" height="45" rx="8" fill="#1a1a1a"/>
    <text x="460" y="262" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="600">Credential expires shortly after (~1 hour)</text>
    <text x="460" y="277" text-anchor="middle" fill="#ccc" font-size="10">No long-lived secret existed at any point above.</text>
  </svg>
</div>
</body>
</html>
