<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audit Trail Override Flow</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #fafafa; margin: 0; padding: 32px; color: #1a1a1a; }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.caption { font-size: 13px; color: #666; margin: 12px 0 0; text-align: center; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Self-Service vs. Override: Where the Audit Trail Lives</h1>
  <svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
      </marker>
    </defs>

    <rect x="330" y="10" width="140" height="36" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
    <text x="400" y="33" font-size="13" text-anchor="middle" fill="#1a1a1a">Spend Request</text>

    <line x1="400" y1="46" x2="250" y2="90" stroke="#444" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <line x1="400" y1="46" x2="550" y2="90" stroke="#444" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <text x="270" y="72" font-size="11" fill="#333">within limit</text>
    <text x="500" y="72" font-size="11" fill="#333">over limit</text>

    <!-- Self service path -->
    <rect x="90" y="90" width="320" height="100" rx="8" fill="#eef4ff" stroke="#3b6fd6" stroke-width="1.5"/>
    <text x="110" y="116" font-size="13" font-weight="600" fill="#3b6fd6">Self-Service Path</text>
    <text x="110" y="138" font-size="12" fill="#333">Auto-approved against soft allocation</text>
    <text x="110" y="158" font-size="12" fill="#333">Logged automatically as usage</text>

    <line x1="250" y1="190" x2="250" y2="240" stroke="#444" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <rect x="120" y="240" width="260" height="50" rx="6" fill="#ffffff" stroke="#3b6fd6"/>
    <text x="250" y="262" font-size="11.5" text-anchor="middle" fill="#3b6fd6" font-weight="600">Structured log entry:</text>
    <text x="250" y="278" font-size="11" text-anchor="middle" fill="#3b6fd6">usage event, no approval needed</text>

    <!-- Override path -->
    <rect x="440" y="90" width="320" height="100" rx="8" fill="#fff3ec" stroke="#d6603b" stroke-width="1.5"/>
    <text x="460" y="116" font-size="13" font-weight="600" fill="#d6603b">Override Path</text>
    <text x="460" y="138" font-size="12" fill="#333">Authenticated CLI / API call only</text>
    <text x="460" y="158" font-size="12" fill="#333">Identity + scope checked before anything happens</text>

    <line x1="600" y1="190" x2="600" y2="240" stroke="#444" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <rect x="460" y="240" width="280" height="70" rx="6" fill="#ffffff" stroke="#d6603b"/>
    <text x="600" y="262" font-size="11.5" text-anchor="middle" fill="#d6603b" font-weight="600">Structured audit log entry:</text>
    <text x="600" y="278" font-size="11" text-anchor="middle" fill="#d6603b">who, resource, old/new limit,</text>
    <text x="600" y="294" font-size="11" text-anchor="middle" fill="#d6603b">timestamp, required justification</text>

    <line x1="250" y1="290" x2="250" y2="330" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="600" y1="310" x2="600" y2="330" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="400" y="350" font-size="11" text-anchor="middle" fill="#999">No email link exists on either path — nothing to forward, screenshot, or replay.</text>
  </svg>
  <p class="caption">Both paths end in a structured, queryable log. Only the override path requires proving who you are before anything changes.</p>
</div>
</body>
</html>
