<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Layered Defense at the LLM Gateway Edge</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #fafafa; margin: 0; padding: 32px; color: #1a1a1a; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.caption { color: #666; font-size: 14px; margin: 0 0 24px; }
  svg { width: 100%; height: auto; display: block; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Layered Defense at the LLM Gateway Edge</h1>
  <p class="caption">The network layer decides who knocks; the payload layer decides what's allowed to be said once they're inside.</p>
  <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
      </marker>
    </defs>

    <!-- Internet -->
    <rect x="30" y="170" width="120" height="80" rx="8" fill="#f5f5f5" stroke="#bbb"/>
    <text x="90" y="205" text-anchor="middle" font-size="14" font-weight="600">Internet</text>
    <text x="90" y="223" text-anchor="middle" font-size="11" fill="#666">clients, bots,</text>
    <text x="90" y="236" text-anchor="middle" font-size="11" fill="#666">attackers</text>

    <line x1="150" y1="210" x2="200" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- WAF layer -->
    <rect x="200" y="140" width="200" height="140" rx="8" fill="#eef4ff" stroke="#7fa8e0"/>
    <text x="300" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#274b7a">Network Layer</text>
    <text x="300" y="182" text-anchor="middle" font-size="12" fill="#274b7a">WAF / Bot Management</text>
    <line x1="215" y1="192" x2="385" y2="192" stroke="#aac4e8"/>
    <text x="300" y="210" text-anchor="middle" font-size="10.5" fill="#4a4a4a">Catches:</text>
    <text x="300" y="226" text-anchor="middle" font-size="10.5" fill="#4a4a4a">volumetric floods</text>
    <text x="300" y="240" text-anchor="middle" font-size="10.5" fill="#4a4a4a">known bot fingerprints</text>
    <text x="300" y="254" text-anchor="middle" font-size="10.5" fill="#4a4a4a">malformed requests</text>
    <text x="300" y="268" text-anchor="middle" font-size="10.5" fill="#c0392b">Blind to: what is said</text>

    <line x1="400" y1="210" x2="450" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Guardrails layer -->
    <rect x="450" y="140" width="220" height="140" rx="8" fill="#fff4e8" stroke="#e0a95f"/>
    <text x="560" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4a1a">Payload-Aware Layer</text>
    <text x="560" y="182" text-anchor="middle" font-size="12" fill="#7a4a1a">Guardrails (in + out)</text>
    <line x1="465" y1="192" x2="655" y2="192" stroke="#eccb9a"/>
    <text x="560" y="210" text-anchor="middle" font-size="10.5" fill="#4a4a4a">Catches:</text>
    <text x="560" y="226" text-anchor="middle" font-size="10.5" fill="#4a4a4a">PII in prompt or completion</text>
    <text x="560" y="240" text-anchor="middle" font-size="10.5" fill="#4a4a4a">prompt-injection heuristics</text>
    <text x="560" y="254" text-anchor="middle" font-size="10.5" fill="#4a4a4a">denied topics, cost-aware limits</text>
    <text x="560" y="268" text-anchor="middle" font-size="10.5" fill="#c0392b">Blind to: traffic volume shape</text>

    <line x1="670" y1="210" x2="720" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Gateway -->
    <rect x="720" y="150" width="120" height="60" rx="8" fill="#f0fff0" stroke="#7bc47f"/>
    <text x="780" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#2c6e2f">LLM Gateway</text>

    <line x1="840" y1="180" x2="890" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Model -->
    <rect x="890" y="150" width="90" height="60" rx="8" fill="#f5f0ff" stroke="#a98fd6"/>
    <text x="935" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#5b3a91">Model</text>

    <!-- return path -->
    <path d="M 935 210 C 935 320, 300 320, 300 300" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="620" y="335" text-anchor="middle" font-size="11" fill="#777">Response also passes back through the payload-aware layer — exfiltration risk runs both directions</text>

    <!-- legend -->
    <text x="30" y="400" font-size="11" fill="#888">Attacks caught by network layer: volumetric DoS, credential stuffing, known bot patterns</text>
    <text x="30" y="418" font-size="11" fill="#888">Attacks caught by payload layer: prompt injection, PII leakage, token-exhaustion cost abuse, data exfiltration via output</text>
  </svg>
</div>
</body>
</html>
