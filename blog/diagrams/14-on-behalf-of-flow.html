<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>On-Behalf-Of Token Exchange</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 18px; color: #1a1a2e; text-align: center; margin: 0 0 4px; }
  p.caption { text-align: center; color: #6b7280; font-size: 13px; margin: 0 0 16px; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>On-Behalf-Of Token Exchange vs. the Blanket-Identity Anti-Pattern</h1>
  <p class="caption">The downstream call should carry the user's identity, not the agent's.</p>
  <svg viewBox="0 0 920 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
      </marker>
      <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
      </marker>
      <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
      </marker>
    </defs>

    <!-- CORRECT FLOW -->
    <text x="20" y="24" font-size="13" font-weight="700" fill="#065f46">✓ On-Behalf-Of Flow</text>

    <rect x="20" y="40" width="120" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="80" y="70" text-anchor="middle" font-size="12" fill="#065f46">User</text>

    <rect x="220" y="40" width="150" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="295" y="62" text-anchor="middle" font-size="12" fill="#065f46">Agent</text>
    <text x="295" y="78" text-anchor="middle" font-size="10" fill="#047857">holds user's token</text>

    <rect x="450" y="40" width="170" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="535" y="62" text-anchor="middle" font-size="12" fill="#065f46">Token Exchange</text>
    <text x="535" y="78" text-anchor="middle" font-size="10" fill="#047857">issues scoped token</text>

    <rect x="700" y="40" width="190" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="795" y="62" text-anchor="middle" font-size="12" fill="#065f46">Downstream API</text>
    <text x="795" y="78" text-anchor="middle" font-size="10" fill="#047857">acts AS the user</text>

    <line x1="140" y1="65" x2="215" y2="65" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <line x1="370" y1="65" x2="445" y2="65" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <line x1="620" y1="65" x2="695" y2="65" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- ANTI PATTERN -->
    <text x="20" y="220" font-size="13" font-weight="700" fill="#991b1b">✗ Blanket-Identity Anti-Pattern</text>

    <rect x="20" y="240" width="120" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="80" y="270" text-anchor="middle" font-size="12" fill="#991b1b">User</text>

    <rect x="220" y="240" width="150" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="295" y="262" text-anchor="middle" font-size="12" fill="#991b1b">Agent</text>
    <text x="295" y="278" text-anchor="middle" font-size="10" fill="#b91c1c">uses own admin cred</text>

    <rect x="700" y="240" width="190" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="795" y="262" text-anchor="middle" font-size="12" fill="#991b1b">Downstream API</text>
    <text x="795" y="278" text-anchor="middle" font-size="10" fill="#b91c1c">acts as "the platform"</text>

    <line x1="140" y1="265" x2="215" y2="265" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <line x1="370" y1="265" x2="695" y2="265" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
    <line x1="480" y1="240" x2="620" y2="290" stroke="#ef4444" stroke-width="3"/>
    <line x1="620" y1="240" x2="480" y2="290" stroke="#ef4444" stroke-width="3"/>

    <text x="460" y="340" text-anchor="middle" font-size="12" fill="#6b7280">No per-user scoping — every request looks identical, and equally powerful.</text>
  </svg>
</div>
</body>
</html>
