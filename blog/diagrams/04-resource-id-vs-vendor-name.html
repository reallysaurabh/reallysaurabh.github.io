<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resource ID vs. Vendor Name</title>
<style>
  body { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; background: #fafafa; color: #1a1a1a; margin: 0; padding: 32px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .caption { color: #666; font-size: 13px; margin-bottom: 20px; }
  svg { width: 100%; height: auto; background: #ffffff; border: 1px solid #e2e2e2; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Coupled vs. Decoupled: Who Holds the Vendor's String?</h1>
  <div class="caption">Left: every consumer holds the vendor's raw model string directly. Right: consumers hold a resource ID you control; only the registry knows the vendor's current string.</div>
  <svg viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,3 L0,6 Z" fill="#444" />
      </marker>
    </defs>

    <!-- Coupled (left) -->
    <text x="200" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#b03a3a">COUPLED</text>
    <rect x="60" y="50" width="120" height="40" rx="6" fill="#f6dcdc" stroke="#b03a3a"/>
    <text x="120" y="74" text-anchor="middle" font-size="11">Service A</text>
    <rect x="200" y="50" width="120" height="40" rx="6" fill="#f6dcdc" stroke="#b03a3a"/>
    <text x="260" y="74" text-anchor="middle" font-size="11">Service B</text>
    <rect x="130" y="120" width="140" height="40" rx="6" fill="#f6dcdc" stroke="#b03a3a"/>
    <text x="200" y="144" text-anchor="middle" font-size="11">Service C</text>

    <line x1="120" y1="90" x2="185" y2="205" stroke="#b03a3a" stroke-width="1.8" marker-end="url(#arrow3)"/>
    <line x1="260" y1="90" x2="205" y2="205" stroke="#b03a3a" stroke-width="1.8" marker-end="url(#arrow3)"/>
    <line x1="200" y1="160" x2="200" y2="205" stroke="#b03a3a" stroke-width="1.8" marker-end="url(#arrow3)"/>

    <rect x="90" y="210" width="220" height="55" rx="8" fill="#8f2c2c"/>
    <text x="200" y="233" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">"provider-model-v2-preview"</text>
    <text x="200" y="250" text-anchor="middle" fill="#fdd" font-size="10.5">vendor's raw string, held by all</text>

    <text x="200" y="300" text-anchor="middle" font-size="12" fill="#8f2c2c">Vendor renames it → everything breaks at once</text>

    <!-- divider -->
    <line x1="440" y1="20" x2="440" y2="340" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Decoupled (right) -->
    <text x="680" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#2e6b2e">DECOUPLED</text>
    <rect x="540" y="50" width="120" height="40" rx="6" fill="#dff0df" stroke="#3c8a3c"/>
    <text x="600" y="74" text-anchor="middle" font-size="11">Service A</text>
    <rect x="680" y="50" width="120" height="40" rx="6" fill="#dff0df" stroke="#3c8a3c"/>
    <text x="740" y="74" text-anchor="middle" font-size="11">Service B</text>
    <rect x="610" y="120" width="140" height="40" rx="6" fill="#dff0df" stroke="#3c8a3c"/>
    <text x="680" y="144" text-anchor="middle" font-size="11">Service C</text>

    <line x1="600" y1="90" x2="665" y2="205" stroke="#3c8a3c" stroke-width="1.8" marker-end="url(#arrow3)"/>
    <line x1="740" y1="90" x2="685" y2="205" stroke="#3c8a3c" stroke-width="1.8" marker-end="url(#arrow3)"/>
    <line x1="680" y1="160" x2="680" y2="205" stroke="#3c8a3c" stroke-width="1.8" marker-end="url(#arrow3)"/>

    <rect x="570" y="210" width="220" height="55" rx="8" fill="#2e6b2e"/>
    <text x="680" y="233" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">"summarizer-v1" (your ID)</text>
    <text x="680" y="250" text-anchor="middle" fill="#dfd" font-size="10.5">registry maps this to vendor string</text>

    <text x="680" y="300" text-anchor="middle" font-size="12" fill="#2e6b2e">Vendor renames it → one row updates, nobody notices</text>
  </svg>
</div>
</body>
</html>
