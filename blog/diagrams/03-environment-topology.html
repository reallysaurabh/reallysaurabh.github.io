<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Environment Topology</title>
<style>
  body { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; background: #fafafa; color: #1a1a1a; margin: 0; padding: 32px; }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .caption { color: #666; font-size: 13px; margin-bottom: 20px; }
  svg { width: 100%; height: auto; background: #ffffff; border: 1px solid #e2e2e2; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Environment Topology: Per-Environment Registrations, Deliberate Promotion</h1>
  <div class="caption">Model registrations live inside each environment, not in one shared global list — promotion between them is an explicit step, never automatic.</div>
  <svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,3 L0,6 Z" fill="#444" />
      </marker>
    </defs>

    <!-- DEV -->
    <rect x="30" y="60" width="250" height="220" rx="10" fill="#f4f8f4" stroke="#3c8a3c" stroke-width="2"/>
    <text x="155" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#2e6b2e">DEV</text>
    <rect x="55" y="105" width="200" height="40" rx="6" fill="#dff0df" stroke="#3c8a3c"/>
    <text x="155" y="129" text-anchor="middle" font-size="12">Model registrations (dev)</text>
    <rect x="55" y="155" width="200" height="40" rx="6" fill="#dff0df" stroke="#3c8a3c"/>
    <text x="155" y="179" text-anchor="middle" font-size="12">Agent configs (dev)</text>
    <rect x="55" y="205" width="200" height="40" rx="6" fill="#dff0df" stroke="#3c8a3c"/>
    <text x="155" y="229" text-anchor="middle" font-size="12">Budget allocation (dev)</text>

    <!-- STAGING -->
    <rect x="355" y="60" width="250" height="220" rx="10" fill="#f6f5ee" stroke="#a8860b" stroke-width="2"/>
    <text x="480" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6d09">STAGING</text>
    <rect x="380" y="105" width="200" height="40" rx="6" fill="#f2ecd0" stroke="#a8860b"/>
    <text x="480" y="129" text-anchor="middle" font-size="12">Model registrations (staging)</text>
    <rect x="380" y="155" width="200" height="40" rx="6" fill="#f2ecd0" stroke="#a8860b"/>
    <text x="480" y="179" text-anchor="middle" font-size="12">Agent configs (staging)</text>
    <rect x="380" y="205" width="200" height="40" rx="6" fill="#f2ecd0" stroke="#a8860b"/>
    <text x="480" y="229" text-anchor="middle" font-size="12">Budget allocation (staging)</text>

    <!-- PROD -->
    <rect x="680" y="60" width="250" height="220" rx="10" fill="#faeeee" stroke="#b03a3a" stroke-width="2"/>
    <text x="805" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#8f2c2c">PRODUCTION</text>
    <rect x="705" y="105" width="200" height="40" rx="6" fill="#f6dcdc" stroke="#b03a3a"/>
    <text x="805" y="129" text-anchor="middle" font-size="12">Model registrations (prod)</text>
    <rect x="705" y="155" width="200" height="40" rx="6" fill="#f6dcdc" stroke="#b03a3a"/>
    <text x="805" y="179" text-anchor="middle" font-size="12">Agent configs (prod)</text>
    <rect x="705" y="205" width="200" height="40" rx="6" fill="#f6dcdc" stroke="#b03a3a"/>
    <text x="805" y="229" text-anchor="middle" font-size="12">Budget allocation (prod)</text>

    <!-- promotion arrows -->
    <line x1="280" y1="170" x2="350" y2="170" stroke="#444" stroke-width="2.5" marker-end="url(#arrow2)"/>
    <text x="315" y="160" text-anchor="middle" font-size="11" fill="#444">promote</text>
    <line x1="605" y1="170" x2="675" y2="170" stroke="#444" stroke-width="2.5" marker-end="url(#arrow2)"/>
    <text x="640" y="160" text-anchor="middle" font-size="11" fill="#444">promote</text>

    <!-- governance callout -->
    <rect x="680" y="300" width="250" height="60" rx="8" fill="#1a1a1a"/>
    <text x="805" y="323" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Governance rule:</text>
    <text x="805" y="342" text-anchor="middle" fill="#fff" font-size="11.5">exactly ONE customer-facing</text>
    <text x="805" y="356" text-anchor="middle" fill="#fff" font-size="11.5">control plane may exist here</text>
  </svg>
</div>
</body>
</html>
