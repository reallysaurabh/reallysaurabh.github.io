<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent Identity vs. Runtime Instance</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 18px; color: #1a1a2e; text-align: center; margin: 0 0 4px; }
  p.caption { text-align: center; color: #6b7280; font-size: 13px; margin: 0 0 16px; }
  svg { width: 100%; height: auto; display: block; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Agent Identity vs. Runtime Instance</h1>
  <p class="caption">One stable identity outlives many disposable runtime instances.</p>
  <svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#6366f1"/>
      </marker>
      <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
      </marker>
    </defs>

    <!-- Identity box -->
    <rect x="310" y="20" width="240" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="430" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#312e81">Agent Identity</text>
    <text x="430" y="68" text-anchor="middle" font-size="11" fill="#4338ca">permissions · memory · audit history</text>

    <!-- vertical spine -->
    <line x1="430" y1="90" x2="430" y2="130" stroke="#6366f1" stroke-width="2"/>

    <!-- Instance v1 (destroyed) -->
    <rect x="60" y="180" width="200" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="160" y="210" text-anchor="middle" font-size="14" fill="#6b7280" text-decoration="line-through">Runtime v1</text>
    <text x="160" y="228" text-anchor="middle" font-size="11" fill="#9ca3af">torn down</text>

    <!-- Instance v2 (destroyed) -->
    <rect x="330" y="180" width="200" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="430" y="210" text-anchor="middle" font-size="14" fill="#6b7280" text-decoration="line-through">Runtime v2</text>
    <text x="430" y="228" text-anchor="middle" font-size="11" fill="#9ca3af">torn down</text>

    <!-- Instance v3 (current) -->
    <rect x="600" y="180" width="200" height="70" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="700" y="210" text-anchor="middle" font-size="14" font-weight="600" fill="#065f46">Runtime v3</text>
    <text x="700" y="228" text-anchor="middle" font-size="11" fill="#059669">current, live</text>

    <!-- connecting lines from spine to each instance -->
    <path d="M430,130 C430,150 160,150 160,180" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrowGray)"/>
    <path d="M430,130 L430,180" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrowGray)"/>
    <path d="M430,130 C430,150 700,150 700,180" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- timeline arrow -->
    <line x1="60" y1="300" x2="800" y2="300" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrowGray)"/>
    <text x="60" y="322" font-size="11" fill="#9ca3af">t0: deploy</text>
    <text x="330" y="322" font-size="11" fill="#9ca3af">t1: redeploy</text>
    <text x="600" y="322" font-size="11" fill="#059669">t2: redeploy again — identity unaffected</text>
  </svg>
</div>
</body>
</html>
